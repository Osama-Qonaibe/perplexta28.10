services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perplexta_app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:postgres@postgres_core:5432/perplexta_core}
      - LEDGER_DATABASE_URL=${LEDGER_DATABASE_URL:-postgres://postgres:postgres@postgres_ledger:5432/perplexta_ledger}
      - SECURITY_DATABASE_URL=${SECURITY_DATABASE_URL:-postgres://postgres:postgres@postgres_security:5432/perplexta_security}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres_core
      - postgres_ledger
    networks:
      - perplexta_internal

  postgres_core:
    image: postgres:16-alpine
    container_name: perplexta_pg_core
    restart: always
    environment:
      POSTGRES_DB: perplexta_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_core_data:/var/lib/postgresql/data
    networks:
      - perplexta_internal

  postgres_ledger:
    image: postgres:16-alpine
    container_name: perplexta_pg_ledger
    restart: always
    environment:
      POSTGRES_DB: perplexta_ledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_ledger_data:/var/lib/postgresql/data
    networks:
      - perplexta_internal

networks:
  perplexta_internal:
    driver: bridge

volumes:
  pg_core_data:
  pg_ledger_data:
